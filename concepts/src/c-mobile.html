<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Direction C — Clubhouse Journal — mobile</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..500&display=swap">
<style>
  :root { --paper: #F6F2EA; --ink: #1C1B18; --moss: #4F5B3A; --sky: #9DBACB; --grey: #77736A; --rule: rgba(28,27,24,.2); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { width: 390px; background: var(--paper); color: var(--ink); font-family: "Newsreader", serif; font-size: 18px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  .sc { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; font-weight: 500; }
  .ph { background: #DCD5C8; display: flex; flex-direction: column; justify-content: flex-end; padding: 14px; color: #6E675B; }
  .ph span { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; }
  header { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; height: 64px; padding: 0 20px; border-bottom: 1px solid var(--ink); }
  .logo { height: 40px; padding: 0 10px; border: 1px dashed #A8A194; display: grid; place-items: center; font-size: 9px; letter-spacing: .12em; text-transform: uppercase; color: var(--grey); font-family: sans-serif; }
  header .r { justify-self: end; font-size: 16px; }
  .wrap { padding: 0 20px; }
  h1 { font-weight: 300; font-size: 58px; line-height: .96; letter-spacing: -.035em; margin-top: 26px; }
  .lede { margin-top: 18px; font-size: 19px; line-height: 1.4; }
  .btn { display: flex; justify-content: center; align-items: center; height: 54px; background: var(--ink); color: var(--paper); font-size: 17px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 24px; }
  .two a:last-child { background: var(--sky); color: var(--ink); }
  .u { display: block; text-align: center; margin-top: 14px; font-size: 17px; text-decoration: underline; text-underline-offset: 4px; }
  figure { margin-top: 30px; }
  figure .ph { height: 420px; }
  figcaption { padding: 8px 20px 0; font-size: 14px; font-style: italic; color: var(--grey); }
  .contents { margin: 36px 20px 0; border-top: 1px solid var(--ink); }
  .contents a { display: grid; grid-template-columns: 36px 1fr auto; align-items: baseline; padding: 18px 0; border-bottom: 1px solid var(--rule); }
  .contents b { font-weight: 400; font-size: 28px; letter-spacing: -.02em; }
  .contents i { color: var(--grey); font-size: 15px; }
</style>
</head>
<body>
  <header><span>Menu</span><span class="logo">Real logo</span><span class="r">Book</span></header>
  <div class="wrap">
    <p class="sc" style="color:var(--moss);margin-top:26px">Indoor golf &amp; bar · Newmarket</p>
    <h1>Golf for the rest of us.</h1>
    <p class="lede">Four Golfzon simulators, two full bars, karaoke and a private room upstairs.</p>
    <div class="two"><a class="btn">Book a bay</a><a class="btn">Book karaoke</a></div>
    <a class="u">Plan a private event</a>
  </div>
  <figure><div class="ph"><span>Photo needed · Portrait at the bar</span></div><figcaption>Fig. 1 — The clubhouse bar, a Thursday, 9:40 pm.</figcaption></figure>
  <p class="sc wrap" style="margin-top:36px;color:var(--grey)">In the club</p>
  <nav class="contents">
    <a><span class="sc">I.</span><b>Golf</b><i>Book →</i></a>
    <a><span class="sc">II.</span><b>Karaoke</b><i>Book →</i></a>
    <a><span class="sc">III.</span><b>Private events</b><i>Inquire →</i></a>
    <a><span class="sc">IV.</span><b>Leagues &amp; lessons</b><i>→</i></a>
  </nav>
</body>
</html>
