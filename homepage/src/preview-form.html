<!-- PREVIEW ONLY — stands in for the existing WordPress form widget.
     It never submits anywhere. -->
<form class="bch-form" data-bch-preview-form novalidate>
  <div class="bch-form__row">
    <div class="bch-field"><label for="bch-f-name">Name</label><input id="bch-f-name" name="name" autocomplete="name" required></div>
    <div class="bch-field"><label for="bch-f-email">Email</label><input id="bch-f-email" name="email" type="email" autocomplete="email" required></div>
  </div>
  <div class="bch-form__row">
    <div class="bch-field"><label for="bch-f-phone">Phone</label><input id="bch-f-phone" name="phone" type="tel" autocomplete="tel" inputmode="tel" required></div>
    <div class="bch-field"><label for="bch-f-date">Preferred date</label><input id="bch-f-date" name="date" type="date" required></div>
  </div>
  <div class="bch-form__row">
    <div class="bch-field"><label for="bch-f-guests">Estimated guests</label><input id="bch-f-guests" name="guests" type="number" inputmode="numeric" min="1" required></div>
    <div class="bch-field"><label for="bch-f-type">Type of event</label>
      <select id="bch-f-type" name="type" required>
        <option value="">Choose one</option>
        <option>Birthday party</option><option>Corporate event</option><option>Holiday / Christmas party</option>
        <option>Team building</option><option>Bachelor / bachelorette</option><option>Group celebration</option><option>Other</option>
      </select>
    </div>
  </div>
  <div class="bch-field"><label for="bch-f-notes">Anything else? <i>(optional)</i></label><textarea id="bch-f-notes" name="notes" rows="3"></textarea></div>
  <button class="bch-btn bch-btn--green" type="submit">Send my event inquiry</button>
  <p class="bch-form__status" role="status" hidden></p>
  <p class="bch-form__note">Preview only: on the live site this panel holds the existing inquiry form, so submissions keep going to the current inbox.</p>
</form>
