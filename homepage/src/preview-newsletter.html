<!-- PREVIEW ONLY — stands in for the existing newsletter widget. -->
<form class="bch-news__form" data-bch-preview-form novalidate>
  <label class="bch-sr" for="bch-n-email">Email address</label>
  <input id="bch-n-email" type="email" name="email" placeholder="you@email.com" autocomplete="email" required>
  <button class="bch-btn" type="submit">Sign up</button>
  <p class="bch-form__status" role="status" hidden></p>
</form>
