<script>
/* The Bogey Club homepage — minimal, dependency-free behaviour.
   Safe to load once site-wide (WPCode footer snippet) or in HTML widget #2.
   No tracking: CTAs carry data-bch-cta for the site's existing GTM/GA. */
(function () {
  "use strict";

  /* Set this to the real karaoke booking URL (copy it from the booking
     button on /karaoke/). While empty, karaoke CTAs open /karaoke/. */
  var KARAOKE_BOOKING_URL = "";

  function ready(fn) {
    if (document.readyState !== "loading") fn();
    else document.addEventListener("DOMContentLoaded", fn);
  }

  ready(function () {
    var html = document.documentElement;

    if (KARAOKE_BOOKING_URL) {
      document.querySelectorAll('[data-bch-link="karaoke-booking"]').forEach(function (a) {
        a.href = KARAOKE_BOOKING_URL;
      });
    }

    /* Missing photo → show the designed fallback instead of a broken image. */
    document.querySelectorAll(".bch-ph img").forEach(function (img) {
      function miss() { img.closest(".bch-ph").classList.add("is-missing"); }
      if (img.complete && img.naturalWidth === 0) miss();
      else img.addEventListener("error", miss, { once: true });
    });

    /* Header: mobile menu */
    var hdr = document.getElementById("bch-hdr");
    var burger = hdr && hdr.querySelector(".bch-burger");
    var nav = document.getElementById("bch-nav");
    if (burger && nav) {
      var setOpen = function (open) {
        burger.setAttribute("aria-expanded", String(open));
        burger.setAttribute("aria-label", open ? "Close menu" : "Open menu");
        nav.classList.toggle("is-open", open);
        html.classList.toggle("bch-lock", open);
        if (open) { var first = nav.querySelector("a"); if (first) first.focus(); }
      };
      burger.addEventListener("click", function () {
        setOpen(burger.getAttribute("aria-expanded") !== "true");
      });
      nav.addEventListener("click", function (e) {
        if (e.target.closest("a")) setOpen(false);
      });
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape" && nav.classList.contains("is-open")) { setOpen(false); burger.focus(); }
      });
      window.matchMedia("(min-width: 1240px)").addEventListener("change", function (mq) {
        if (mq.matches) setOpen(false);
      });
    }

    if (hdr) {
      var onScroll = function () { hdr.classList.toggle("is-scrolled", window.scrollY > 8); };
      window.addEventListener("scroll", onScroll, { passive: true });
      onScroll();
    }

    /* Mobile booking bar: show once the hero's own buttons are off screen
       (on pages without a hero, show after a short scroll). */
    var bar = document.getElementById("bch-bookbar");
    if (bar) {
      var heroCtas = document.querySelector(".bch-hero__ctas");
      if (heroCtas && "IntersectionObserver" in window) {
        new IntersectionObserver(function (entries) {
          var e = entries[entries.length - 1];
          bar.classList.toggle("is-visible", !e.isIntersecting && e.boundingClientRect.top < 0);
        }).observe(heroCtas);
      } else {
        var onBar = function () { bar.classList.toggle("is-visible", window.scrollY > 300); };
        window.addEventListener("scroll", onBar, { passive: true });
        onBar();
      }
    }

    document.querySelectorAll("[data-bch-year]").forEach(function (el) {
      el.textContent = String(new Date().getFullYear());
    });

    /* Preview-only demo forms (preview.html). Live forms are untouched. */
    document.querySelectorAll("form[data-bch-preview-form]").forEach(function (form) {
      form.addEventListener("submit", function (e) {
        e.preventDefault();
        var status = form.querySelector(".bch-form__status");
        var ok = form.checkValidity();
        if (!ok) form.reportValidity();
        if (status) {
          status.hidden = false;
          status.textContent = ok
            ? "Preview: this would be sent by the existing WordPress form."
            : "Please complete the required fields.";
        }
      });
    });
  });
})();
</script>
