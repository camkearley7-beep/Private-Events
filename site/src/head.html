     SITE <head> — WPCode > Add Snippet > HTML, location "Site Wide Header".
     Satoshi Variable (Indian Type Foundry, ITF Free Font License, free for
     commercial use): one file covering weights 300–900. Upload
     Satoshi-Variable.woff2 from site/dist/uploads/fonts/ to
     /wp-content/uploads/fonts/ (or Elementor > Custom Fonts, family "Satoshi").
     ===================================================================== -->
<link rel="preload" href="{{FONTS}}/Satoshi-Variable.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face { font-family: 'Satoshi'; src: url('{{FONTS}}/Satoshi-Variable.woff2') format('woff2-variations'), url('{{FONTS}}/Satoshi-Variable.woff2') format('woff2'); font-weight: 300 900; font-style: normal; font-display: swap; }
</style>
